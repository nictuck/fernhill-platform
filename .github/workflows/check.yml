name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install jq
        run: sudo apt-get update -q && sudo apt-get install -y -q jq
      # On PRs into main and on main itself, refuse artifacts no human has gated.
      - name: make check (gate checks on)
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: make check ARGS="--target main"
      - name: make check
        if: github.base_ref != 'main' && github.ref != 'refs/heads/main'
        run: make check
